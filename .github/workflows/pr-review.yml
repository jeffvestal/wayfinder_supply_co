name: Elastic Agent PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "**"

jobs:
  trigger-elastic-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Call Elastic Agent Builder + Post PR Comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          DIFF_URL: ${{ github.event.pull_request.diff_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          ELASTIC_KIBANA_URL: ${{ secrets.ELASTIC_KIBANA_URL }}
          ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        run: |
          if [ -z "$ELASTIC_KIBANA_URL" ] || [ -z "$ELASTIC_API_KEY" ]; then
            echo "Elastic secrets not configured — skipping PR review"
            exit 0
          fi

          # Download the diff content to pass directly to the agent
          diff_content=$(curl -sL "${DIFF_URL}" | head -c 8000 || echo "(diff unavailable)")

          input_msg=$(printf "Review PR #%s in %s. Title: %s. Head SHA: %s.\n\nDiff (first 8KB):\n%s\n\nUsing your tools, search OTel traces for the /api/v1/checkout/reserve endpoint and search historical incident postmortems for patterns related to this change. Correlate findings and summarize risk. Return analysis as text." \
            "$PR_NUMBER" "$REPO" "$PR_TITLE" "$HEAD_SHA" "$diff_content")

          payload=$(jq -n \
            --arg agent_id "msbuild-pr-review-agent" \
            --arg input "$input_msg" \
            '{agent_id: $agent_id, input: $input}')

          raw_response=$(curl -fsS --no-buffer \
            -H "Authorization: ApiKey ${ELASTIC_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "kbn-xsrf: true" \
            -d "$payload" \
            "${ELASTIC_KIBANA_URL}/api/agent_builder/converse/async" 2>&1)

          agent_comment=$(echo "$raw_response" | grep '^data:' | sed 's/^data: //' | python3 -c "
          import sys, json
          parts = []
          final = ''
          for line in sys.stdin:
              line = line.strip()
              if not line:
                  continue
              try:
                  d = json.loads(line)
                  delta = d.get('data', {})
                  if 'message_content' in delta:
                      final = delta['message_content']
                  elif 'text_chunk' in delta:
                      parts.append(delta['text_chunk'])
              except:
                  pass
          result = (final or ''.join(parts)).strip()
          if result:
              print(result)
          ")

          if [ -z "$agent_comment" ]; then
            echo "Agent returned no analysis — skipping PR comment"
            exit 0
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "## Elastic Agent Builder — PR Review

          $agent_comment

          ---
          *Analysis powered by [Elastic Agent Builder](https://elastic.co/agent-builder) + OTel traces*"
