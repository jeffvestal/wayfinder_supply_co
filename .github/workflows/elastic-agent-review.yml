name: Elastic Agent PR Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  trigger-elastic-review:
    runs-on: ubuntu-latest
    if: ${{ secrets.ELASTIC_WORKFLOW_URL != '' }}
    steps:
      - name: Trigger Elastic Workflow
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          DIFF_URL: ${{ github.event.pull_request.diff_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          payload=$(jq -n \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg repo "$REPO" \
            --arg diff_url "$DIFF_URL" \
            --arg head_sha "$HEAD_SHA" \
            '{pr_number: $pr_number, pr_title: $pr_title, repo: $repo, diff_url: $diff_url, head_sha: $head_sha}')

          curl -fsS --fail-with-body \
            -H "Authorization: ApiKey ${{ secrets.ELASTIC_WORKFLOW_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${{ secrets.ELASTIC_WORKFLOW_URL }}"
