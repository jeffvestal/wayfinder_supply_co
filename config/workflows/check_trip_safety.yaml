version: "1"
name: check_trip_safety
enabled: true

inputs:
  - name: location
    type: string
    required: true
    description: "The destination location (e.g., 'Rockies', 'Denver', 'Yosemite')"
  - name: dates
    type: string
    required: true
    description: "Date range or specific date (e.g., '2024-01-15', 'January 15-20, 2024')"

triggers:
  - type: manual

steps:
  - name: call_grounding_api
    type: http
    with:
      url: "http://host-1:8002/api/vision/ground"
      method: POST
      headers:
        Content-Type: application/json
      body:
        location: "{{ inputs.location }}"
        activity: "outdoor trip on {{ inputs.dates }}"
      timeout: 30s
    on-failure:
      retry:
        max-attempts: 2
        delay: 1s

  - name: parse_response
    type: console
    with:
      message: |
        Trip Conditions for {{ inputs.location }} ({{ inputs.dates }}):
        {% if steps.call_grounding_api.output.data.conditions.conditions_text %}
        {{ steps.call_grounding_api.output.data.conditions.conditions_text }}
        {% elsif steps.call_grounding_api.output.data.conditions.temperature_f %}
        Temperature: {{ steps.call_grounding_api.output.data.conditions.temperature_f }}°F
        Conditions: {{ steps.call_grounding_api.output.data.conditions.conditions }}
        Wind: {{ steps.call_grounding_api.output.data.conditions.wind_mph }} mph
        Trail Status: {{ steps.call_grounding_api.output.data.conditions.trail_status }}
        Safety Notes: {{ steps.call_grounding_api.output.data.conditions.safety_notes }}
        {% else %}
        {{ steps.call_grounding_api.output.data }}
        {% endif %}


